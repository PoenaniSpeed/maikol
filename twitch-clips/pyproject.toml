[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-clips"
version = "0.1.0"
description = "Twitch opnemen, chatpieken vinden en 9:16-clips met ingebrande ondertitels maken"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlink>=6.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
twitch-clips = "twitchclips.cli:main"

[tool.setuptools]
packages = ["twitchclips"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
